name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML dependencies
        run: pip install -r ml_service/requirements-dev.txt
      - name: Run ML tests
        working-directory: ml_service
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health && curl -sf http://localhost:8000/api/v1/health && break
            sleep 5
          done
      - name: Install seed dependencies
        run: python -m pip install "psycopg[binary]==3.3.8"
      - name: Seed CSV data
        env:
          DATABASE_URL: postgresql://${POSTGRES_USER:-isc}:${POSTGRES_PASSWORD:-isc_password}@postgres:5432/${POSTGRES_DB:-intelligent_supply_chain}
        run: python database/seeds/seed_from_csv.py --target local
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Seed users
        working-directory: backend
        env:
          DATABASE_URL: postgresql://${POSTGRES_USER:-isc}:${POSTGRES_PASSWORD:-isc_password}@postgres:5432/${POSTGRES_DB:-intelligent_supply_chain}
        run: npm run seed:users
      - name: Seed route-candidate data
        env:
          DATABASE_URL: postgresql://${POSTGRES_USER:-isc}:${POSTGRES_PASSWORD:-isc_password}@postgres:5432/${POSTGRES_DB:-intelligent_supply_chain}
        run: python database/seeds/seed_route_candidates.py
      - name: Run backend tests
        working-directory: backend
        run: npm test
      - name: Tear down
        if: always()
        run: docker compose down -v
