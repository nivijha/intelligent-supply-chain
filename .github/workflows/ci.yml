```yaml
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ml-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML dependencies
        run: pip install -r ml_service/requirements-dev.txt

      - name: Run ML tests
        working-directory: ml_service
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install backend dependencies BEFORE executing Node.js scripts.
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for PostgreSQL readiness
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U isc -d intelligent_supply_chain; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/60)"
            sleep 5
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/health >/dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 5
          done
          echo "Backend did not become ready in time" >&2
          exit 1

      - name: Wait for ML service readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health/ready >/dev/null 2>&1; then
              echo "ML service is ready"
              exit 0
            fi
            echo "Waiting for ML service... ($i/60)"
            sleep 5
          done
          echo "ML service did not become ready in time" >&2
          exit 1

      - name: Install seed dependencies
        run: python -m pip install "psycopg[binary]==3.3.8"

      - name: Seed CSV data
        env:
          DATABASE_URL: postgresql://isc:isc_password@localhost:5433/intelligent_supply_chain
        run: python database/seeds/seed_from_csv.py --target local

      - name: Seed backend users
        working-directory: backend
        env:
          DATABASE_URL: postgresql://isc:isc_password@localhost:5433/intelligent_supply_chain
          ALLOW_SEED_USERS: "true"
          NODE_ENV: "test"
        run: npm run seed:users

      - name: Seed route-candidate data
        env:
          DATABASE_URL: postgresql://isc:isc_password@localhost:5433/intelligent_supply_chain
        run: python database/seeds/seed_route_candidates.py

      - name: Verify seeded database
        run: |
          docker compose exec -T postgres psql -U isc -d intelligent_supply_chain -c "SELECT name FROM roles ORDER BY name;"
          docker compose exec -T postgres psql -U isc -d intelligent_supply_chain -c "SELECT email FROM users ORDER BY email;"
          docker compose exec -T postgres psql -U isc -d intelligent_supply_chain -c "SELECT COUNT(*) FROM audit_logs;"

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Print backend logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 backend || true

      - name: Print postgres logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres || true

      - name: Print ML service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 ml-service || true

      - name: Tear down containers
        if: always()
        run: docker compose down
```