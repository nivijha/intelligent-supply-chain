services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}

  backend:
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-isc}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}@postgres:5432/${POSTGRES_DB:-intelligent_supply_chain}
